      - eureka-service
      - book-database
    networks:
      backend:
        aliases:
          - "book-service"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
  genre-service:
      image: genre-service:alpine
      ports:
        - "8093:8093"
      environment:
        - "SPRING_PROFILES_ACTIVE=prod"
      depends_on:
        - config-service
        - eureka-service
        - genre-database
      networks:
        backend:
          aliases:
            - "genre-service"
      deploy:
        restart_policy:
