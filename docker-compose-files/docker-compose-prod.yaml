        window: 60s
  bookstore-service:
    image: bookstore-service:alpine
    ports:
      - "8091:8091"
    environment:
      - "SPRING_PROFILES_ACTIVE=prod"
    depends_on:
      - config-service
      - eureka-service
    networks:
      backend:
        aliases:
          - "bookstore-service"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
  bookstore-web-application:
    image: bookstore-web-application:alpine
    ports:
      - "4200:4200"
    networks:
      backend:
        aliases:
          - "bookstore-web-application"
networks:
  backend:
    external: true