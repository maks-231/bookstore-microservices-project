        window: 60s
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
  config-service:
    image: config-service:alpine
    ports:
      - "8071:8071"
    networks:
      backend:
        aliases:
          - "config-service"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
  eureka-service:
    image: eureka-service:alpine
    ports:
      - "8761:8761"
    depends_on:
      - config-service
    networks:
      backend:
        aliases:
          - "eureka-service"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
  gateway-service:
    image: gateway-service:alpine
    ports:
      - "8090:8090"
    depends_on:
      - config-service
      - eureka-service
    networks:
      backend:
        aliases:
          - "gateway-service"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
networks:
  backend:
    external: true