gatewayserver:
  property: Development property

spring:
  main:
    web-application-type: REACTIVE
  cloud:
    gateway:
      enabled: true
      discovery.locator:
        enabled: true
        lowerCaseServiceId: true
      default-filters:
        - TokenRelay=
      routes:
        - id: bookstoreservice
          uri: lb://bookstoreservice
          predicates:
            - Path=/bookstore/**
          filters:
            - RewritePath=/bookstore/(?<path>.*), /$\{path}
  application:
    name: gatewayserver
logging:
  level:
    com.netfliex: DEBUG
    org.springframework: DEBUG
    com:
      mkyong: OFF
      zaxxer: OFF
    root: OFF

eureka:
  instance:
    hostname: gatewayserver
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: http://locahost:8761/eureka/

management:
  endpoints:
    health:
      show-details: always
      diskspace:
        enabled: true
    beans:
      enabled: true
    shutdown:
      enabled: true
    info:
      enabled: true
    web:
      exposure:
        include: 'gateway'
    enabled-by-default: true