book-store-service:
  property: Default property
#  host-db-host: book-store-database-master
  host-db-host: localhost
  db-port: 5832
  db-name: book-store
  driver-name: org.postgresql.Driver

spring:
  application:
    name: bookstoreservice
  datasource:
    url: jdbc:postgresql://${book-store-service.host-db-host}:${book-store-service.db-port}/${book-store-service.db-name}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    service-registry:
      auto-registration:
        enabled: false

hibernate:
  show_sql: true
  dialect: org.hibernate.dialect.PostgreSQLDialect
  batch.size: 200
  hbm2ddl.auto: update

management:
  endpoint:
    health:
      diskspace:
        enabled: true
    beans:
      enabled: true
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "*"

logging:
  level:
    com.netflix: INFO
    org.springframework: INFO
    com:
      mkyong: OFF
      zaxxer: OFF
    root: DEBUG

eureka:
  instance:
    hostname: bookstoreservice
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka