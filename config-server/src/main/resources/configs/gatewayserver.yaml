gatewayserver:
  property: Default property

spring:
  main:
    web-application-type: REACTIVE
  cloud:
    gateway:
      enabled: true
      discovery.locator:
          enabled: true
          lowerCaseServiceId: true
#      default-filters:
#        - TokenRelay=
      routes:
        - id: bookstoreservice
          uri: lb://bookstoreservice
          predicates:
            - Path=/bookstore/**
          filters:
            - RewritePath=/bookstore/(?<path>.*), /$\{path}
  application:
    name: gatewayserver

server:
  port: 8081

eureka:
  instance:
    hostname: eurekaserver
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    health:
      show-details: always
      diskspace:
        enabled: true
    beans:
      enabled: true
    shutdown:
      enabled: true
    info:
      enabled: true
    web:
      exposure:
        include: 'gateway'
    enabled-by-default: true

logging:
  level:
    com.netflix: DEBUG


