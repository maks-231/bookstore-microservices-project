eurekaserver:
  property: Default property

spring:
  application:
    name: eurekaserver

server:
  port: 8761

eureka:
  instance:
    hostname: 192.168.70.73
    homePageUrl: http://${eureka.instance.hostname}:${server.port}/
    statusPageUrl: http://${eureka.instance.hostname}:${server.port}/actuator/info/
    healthCheckUrl: http://${eureka.instance.hostname}:${server.port}/actuator/health/
  client:
    fetch-registry: false
    register-with-eureka: false
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

logging:
  level:
    com.netflix: INFO
    org.springframework: INFO
    com:
      mkyong: OFF
      zaxxer: OFF
    root: OFF

management:
  endpoints:
    web:
      exposure:
        include: "*"


