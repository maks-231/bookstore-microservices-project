bookstoreservice:
  property: Development property

spring:
  application:
    name: bookstoreservice
  datasource:
    url: jdbc:postgresql://localhost:5832/book-store?prepareThreshold=0
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  error:
    whitelabel:
      enabled: false

hibernate:
  show_sql: true
  dialect: org.hibernate.dialect.PostgreSQLDialect
  batch.size: 200
  hbm2ddl.auto: update

management:
  endpoint:
    health:
      diskspace:
        enabled: true
    beans:
      enabled: true
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "*"
#  # Enable prometheus exporter
#  metrics:
#    export:
#    prometheus:
#      enabled: true
#    ## Enable prometheus end point
#    web:
#      exposure:
#        include: prometheus

logging:
  level:
    com.netflix: INFO
    org.springframework: INFO
    com:
      mkyong: OFF
      zaxxer: OFF
    root: OFF

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka