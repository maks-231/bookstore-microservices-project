<p-confirmDialog></p-confirmDialog>
<div class="w-8 m-auto pt-5">

    <i class="pi pi-fw pi-home" routerLink="/" style="cursor: pointer;"></i> | <a
        routerLink="/builds">{{book.genre?.name}}</a> | {{book.title}}

    <div style="float: right" class="-mt-3">
        <p-button icon="pi pi-pencil" label="Edit" [routerLink]="'/book/edit/' + book.isbn"></p-button>
        <p-button icon="pi pi-trash" label="Delete" class="ml-2" (click)="deleteBook($event)"
            severity="danger"></p-button>
    </div>

    <p-divider type="solid" class="mt-2"></p-divider>

    <div class="grid mt-2">
        <div class="col-4">
            <img [src]="book.image?.content || '../../../assets/img/missing-book-cover.jpg'"
                style="height: 600px; width: 391px; object-fit: cover;" class="border-round">
        </div>
        <div class="col-8">

            <div class="grid">
                <div class="col-12">
                    <h1>{{book.title}}</h1>

                </div>
                <div class="col-12">
                    <h1 class="text-red-600">${{book.price}}</h1>
                </div>

                <p-panel header="Author(s)" class="col-12">
                    <div class="text-div" *ngFor="let bookAuthor of book.authors">
                        <span class="text-span">Name:</span>
                        <span class="text-span pull-right font-bold">{{bookAuthor.name}}</span>
                    </div>
                </p-panel>

                <p-panel header="Book info" class="col-6">
                    <div class="text-div">
                        <span class="text-span">Language:</span>
                        <span class="text-span pull-right font-bold">{{book.language}}</span>
                    </div>
                    <div class="text-div">
                        <span class="text-span">ISBN:</span>
                        <span class="text-span pull-right font-bold">{{book.isbn}}</span>
                    </div>
                </p-panel>

                <p-panel header="Publishing" class="col-6">
                    <div class="text-div">
                        <span class="text-span">Publisher:</span>
                        <span class="text-span pull-right font-bold">{{book.publisher?.name}}</span>
                    </div>
                    <div class="text-div">
                        <span class="text-span">Publication date:</span>
                        <span class="text-span pull-right font-bold">{{book.publicationDate}}</span>
                    </div>
                </p-panel>


            </div>
        </div>
    </div>

    <p-divider></p-divider>

    <div class="grid">
        <div class="col-12">
            <div class="ql-container ql-snow" style="border-width: 0;" class="m-auto mt-5">
                <div class="ql-editor" [innerHTML]="book.description">
                </div>
            </div>
        </div>
    </div>

</div>
