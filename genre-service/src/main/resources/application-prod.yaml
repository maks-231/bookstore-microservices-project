spring:
  main:
    lazy-initialization: true
  application:
    name: genre-service
  config:
    import: optional:configserver:http://config-service:8071
logging:
  group:
    tomcat: "org.apache.catalina,org.apache.coyote,org.apache.tomcat"
  level:
    level:
      root: "warn"
    org:
      springframework:
        web: "debug"
      genre:
        profiler:
          CustomPerformanceMonitorInterceptor: TRACE